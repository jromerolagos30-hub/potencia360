<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PotencIA 360</title>
<style>body{margin:0;font-family:Arial;color:#10233f}header{padding:18px 6%;display:flex;justify-content:space-between;border-bottom:1px solid #e1e8f0}.logo{font-weight:900;font-size:22px}.logo b{color:#0878ef}.hero{padding:70px 6%;background:linear-gradient(120deg,#071e3d,#0758a6);color:white}.hero h1{font-size:48px;max-width:650px;margin:0}.hero p{max-width:650px;line-height:1.6;color:#dcecff}.section{max-width:1150px;margin:40px auto;padding:0 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #dce5ef;border-radius:16px;padding:20px}.tag{font-size:12px;color:#0878ef;font-weight:bold}.card a{display:inline-block;margin-top:10px;background:#0878ef;color:white;text-decoration:none;padding:10px 13px;border-radius:9px;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}</style></head><body>
<header><div class="logo">Potenc<b>IA</b> 360</div><div>Explorar cursos · Rutas · PotencIA IA</div></header><section class="hero"><h1>¿Qué quieres aprender hoy?</h1><p>Descubre cursos seleccionados y formación propia. Construye una ruta personalizada según tu objetivo, nivel y tiempo disponible.</p></section>
<section class="section"><h2>Cursos seleccionados</h2><div class="grid" id="grid"></div></section>
<script>async function go(){let d=await(await fetch('/catalog.json',{cache:'no-store'})).json();grid.innerHTML=d.filter(x=>x.status==='Publicado').map(c=>`<article class="card"><div class="tag">${c.provider} · ${c.category}</div><h3>${c.title}</h3><p>${c.subtitle||''}</p><b>${c.price||'Consultar'}</b><br><a href="/curso/?id=${encodeURIComponent(c.id)}">Ver ficha →</a></article>`).join('')}go()</script></body></html>
