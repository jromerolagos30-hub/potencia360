<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso | PotencIA 360</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071d38;--blue:#087cf0;--muted:#60758e;--line:#e1e9f2}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--navy);background:#fff}a{text-decoration:none;color:inherit}
header{height:82px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.nav{max-width:1400px;width:100%;margin:auto;padding:0 32px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:900}.brand b{color:var(--blue)}.links{display:flex;gap:30px;font-weight:700}
.hero{background:linear-gradient(120deg,#06203f,#0b4f8b);color:#fff;padding:58px 0}.wrap{max-width:1400px;margin:auto;padding:0 32px}.grid{display:grid;grid-template-columns:1.7fr .72fr;gap:60px}.crumb{color:#59c3ff;font-size:14px}.hero h1{font-size:43px;line-height:1.12;margin:20px 0}.subtitle{font-size:20px;line-height:1.55;color:#e4edf6}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tag{border:1px solid #6b8baa;border-radius:99px;padding:7px 12px;font-size:13px}.meta{display:flex;gap:25px;flex-wrap:wrap;font-size:14px}
.buy{background:#fff;color:var(--navy);border-radius:20px;padding:24px;box-shadow:0 20px 45px #00152c44}.cover{height:225px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#071e3c,#1688f7);position:relative;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2}.coverFallback{position:absolute;color:#fff;text-align:center;font-weight:900;font-size:28px;padding:25px}.coverFallback span{color:#62b6ff}.provider{color:var(--muted);font-size:13px;margin-top:12px}.buy h3{font-size:20px}.price{font-size:31px;font-weight:900;margin:20px 0}.price small{font-size:13px;color:#8797a9;font-weight:400}.cta{display:block;background:var(--blue);color:#fff;text-align:center;padding:16px;border-radius:10px;font-weight:900}.disabled{background:#9caec0;pointer-events:none}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:15px}
.content{padding:50px 0}.cols{display:grid;grid-template-columns:1.7fr .72fr;gap:60px}.panel{border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:22px}.panel h2{margin-top:0}.learn{display:grid;grid-template-columns:1fr 1fr;gap:13px}.learn div:before{content:"✓";color:#0aa06e;font-weight:900;margin-right:9px}.desc{line-height:1.7;color:#30455e;white-space:pre-line}.error{max-width:800px;margin:80px auto;text-align:center;padding:30px}
@media(max-width:850px){.grid,.cols{grid-template-columns:1fr}.links{display:none}.hero h1{font-size:34px}.learn{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><a class="brand" href="/">Potenc<b>IA</b> 360</a><div class="links"><a href="/">Inicio</a><a href="/#cursos">Explorar cursos</a><a href="/#ia">PotencIA IA</a></div></div></header>
<div id="page"><div class="error">Cargando curso…</div></div>
<script>
const SB=supabase.createClient("https://dhfaoqpafdyubqqltolp.supabase.co","sb_publishable_tF1l9utIJDNReULa5yM9Hg_Y93Vy7VR");
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function money(c){return c.price==null?'Consultar precio en el proveedor':`S/ ${Number(c.price).toFixed(2)}`}
async function load(){
 const slug=new URLSearchParams(location.search).get('id');
 if(!slug){document.getElementById('page').innerHTML='<div class="error"><h2>Curso no especificado</h2><a href="/">Volver al inicio</a></div>';return}
 const {data:c,error}=await SB.from('courses').select('*').eq('slug',slug).eq('status','published').maybeSingle();
 if(error||!c){document.getElementById('page').innerHTML='<div class="error"><h2>Este curso no está publicado</h2><p>Puede estar en borrador o haber sido retirado.</p><a href="/">← Volver a PotencIA 360</a></div>';return}
 document.title=c.title+' | PotencIA 360';
 const tags=(c.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
 const learn=(c.learning||[]).map(x=>`<div>${esc(x)}</div>`).join('');
 const req=(c.requirements||[]).map(x=>`<li>${esc(x)}</li>`).join('');
 const img=c.image_url?`<img src="${esc(c.image_url)}" onerror="this.remove()" alt="${esc(c.title)}">`:'';
 const link=c.course_url?`<a class="cta" target="_blank" rel="noopener noreferrer" href="${esc(c.course_url)}">Ver curso en ${esc(c.provider)} →</a>`:`<span class="cta disabled">Enlace pendiente</span>`;
 document.getElementById('page').innerHTML=`
 <section class="hero"><div class="wrap grid"><div><div class="crumb">${esc(c.category||'Curso')} › ${esc(c.provider)}</div><h1>${esc(c.title)}</h1><div class="subtitle">${esc(c.subtitle||'')}</div><div class="tags">${tags}</div><div class="meta">${c.rating?`<span>★ ${esc(c.rating)}${c.reviews?` (${Number(c.reviews).toLocaleString('es-PE')} valoraciones)`:''}</span>`:''}${c.students?`<span>${Number(c.students).toLocaleString('es-PE')} estudiantes</span>`:''}${c.duration?`<span>${esc(c.duration)}</span>`:''}<span>${esc(c.language||'Español')}</span></div></div>
 <aside class="buy"><div class="cover">${img}<div class="coverFallback">Potenc<span>IA</span> 360<br><small>${esc(c.category||'Curso')}</small></div></div><div class="provider">Proveedor</div><h3>${esc(c.provider)}</h3><div class="price">${money(c)} ${c.original_price?`<small><s>S/ ${Number(c.original_price).toFixed(2)}</s></small>`:''}</div>${link}<div class="note">La compra y el acceso se realizan en la plataforma del proveedor. Precio y condiciones pueden cambiar.</div></aside></div></section>
 <section class="content"><div class="wrap cols"><main>${learn?`<div class="panel"><h2>Lo que aprenderás</h2><div class="learn">${learn}</div></div>`:''}${c.description?`<div class="panel"><h2>Descripción</h2><div class="desc">${esc(c.description)}</div></div>`:''}</main><aside>${req?`<div class="panel"><h2>Requisitos</h2><ul>${req}</ul></div>`:''}<div class="panel"><h2>Información</h2><p><b>Instructor:</b> ${esc(c.instructor||'—')}</p><p><b>Nivel:</b> ${esc(c.level||'Todos los niveles')}</p><p><b>Actualización:</b> ${esc(c.updated_label||'—')}</p></div></aside></div></section>`}
load();
</script></body></html>
