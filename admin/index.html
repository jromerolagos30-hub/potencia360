<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | PotencIA 360</title><style>
body{font-family:Arial;background:#f4f7fb;color:#092344;margin:0}.w{max-width:1100px;margin:30px auto;padding:20px}.box{background:#fff;border:1px solid #dbe5f0;border-radius:18px;padding:25px}.warn{background:#fff6d8;border:1px solid #edd273;padding:12px;border-radius:9px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.full{grid-column:1/-1}.two{grid-column:span 2}label{font-size:12px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cdd8e4;border-radius:8px;margin-top:5px}textarea{min-height:78px}button{background:#0878ef;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold;margin-top:15px}pre{background:#071e3d;color:#dff3ff;padding:16px;border-radius:12px;overflow:auto}@media(max-width:750px){.g{grid-template-columns:1fr}.full,.two{grid-column:auto}}</style></head><body><div class="w"><div class="box"><h1>Administrador · PotencIA 360</h1><div class="warn">V5: ficha enriquecida con portada, valoración y enlace a opiniones. Aún falta autenticación y base de datos.</div><div class="g">
<div><label>Proveedor<select id="provider"><option>Udemy</option><option>PotencIA 360</option></select></label></div><div class="two"><label>Título<input id="title"></label></div><div class="full"><label>Resumen<input id="subtitle"></label></div>
<div><label>Instructor<input id="instructor"></label></div><div><label>Categoría<input id="category"></label></div><div><label>Nivel<input id="level"></label></div><div><label>Idioma<input id="language" value="Español"></label></div><div><label>Duración<input id="duration"></label></div><div><label>Clases/secciones<input id="lessons"></label></div>
<div><label>Valoración<input id="rating"></label></div><div><label>N.º valoraciones<input id="reviews"></label></div><div><label>Estudiantes<input id="students"></label></div><div><label>Actualización<input id="updated"></label></div><div><label>Precio<input id="price"></label></div><div><label>Precio anterior<input id="original_price"></label></div>
<div class="full"><label>URL de portada / imagen<input id="image_url" placeholder="https://..."></label></div><div class="full"><label>URL del curso<input id="url"></label></div><div class="full"><label>URL de opiniones<input id="reviews_url"></label></div><div class="full"><label>Etiquetas, separadas por coma<input id="tags"></label></div>
<div class="full"><label>Qué aprenderás, un punto por línea<textarea id="learning"></textarea></label></div><div class="full"><label>Requisitos, uno por línea<textarea id="requirements"></textarea></label></div><div class="full"><label>Descripción<textarea id="description"></textarea></label></div></div>
<button onclick="make()">Generar ficha JSON</button><pre id="out">{{}}</pre></div></div><script>
const v=id=>document.getElementById(id).value, lines=id=>v(id).split('\\n').map(x=>x.trim()).filter(Boolean);
function make(){let o={};['provider','title','subtitle','instructor','category','level','language','duration','lessons','rating','reviews','students','updated','price','original_price','image_url','url','reviews_url','description'].forEach(x=>o[x]=v(x));o.id=o.title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');o.tags=v('tags').split(',').map(x=>x.trim()).filter(Boolean);o.learning=lines('learning');o.requirements=lines('requirements');o.status='Publicado';o.featured=false;out.textContent=JSON.stringify(o,null,2)}
</script></body></html>
